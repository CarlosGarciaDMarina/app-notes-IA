<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotesOrg - Frontend</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>NotesOrg</h1>
        <p>Notas, cuadernos y etiquetas - interfaz mínima</p>
      </header>

      <section class="panel" id="formPanel">
        <h2>Nueva nota</h2>
        <form id="noteForm">
          <div class="field">
            <label for="title">Título</label>
            <input id="title" name="title" required />
          </div>
          <div class="field">
            <label for="content">Contenido</label>
            <textarea id="content" name="content" rows="4" required></textarea>
          </div>
          <div class="field">
            <label for="notebook">Cuaderno</label>
            <input id="notebook" name="notebook" />
          </div>
          <div class="field">
            <label for="tags">Etiquetas (coma separadas)</label>
            <input id="tags" name="tags" />
          </div>
          <button type="submit">Agregar nota</button>
        </form>
      </section>

      <section class="panel" id="filters">
        <h2>Filtro</h2>
        <div class="field">
          <label for="notebookFilter">Cuaderno</label>
          <select id="notebookFilter"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="tagFilter">Etiqueta</label>
          <input id="tagFilter" placeholder="buscar por etiqueta" />
        </div>
        <button id="applyFilters">Aplicar</button>
      </section>

      <section class="panel" id="notesPanel">
        <h2>Notas</h2>
        <div id="notesList" class="notes"></div>
      </section>
  </div>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite" style="display:none;"></div>
  <div id="noteModal" class="modal-overlay" aria-hidden="true" style="display:none;">
    <div class="modal-content" role="dialog" aria-label="Nota completa">
      <div class="modal-header" style="display:flex; justify-content:center; align-items:center;">
        <div class="modal-title" id="modalTitle" style="text-align:center; width:100%; font-weight:700;"></div>
      </div>
      <div id="modalBody" class="modal-body"></div>
        <div class="modal-footer" style="display:flex; justify-content: space-between; align-items:center; padding-top:8px; border-top:1px solid #2a2f57; margin-top:8px;">
          <div class="modal-actions-left" style="display:flex; gap:8px;">
          <button id="modalSave" class="edit-btn" type="button" aria-label="Guardar cambios">Guardar cambios</button>
          <button id="modalDelete" class="delete-btn" type="button" aria-label="Eliminar" style="background:#8b1a1a;">Eliminar</button>
          </div>
          <button id="modalClose" class="close-btn" aria-label="Cerrar">Cerrar</button>
        </div>
  </div>
  </div>
  <!-- Confirm Deletion Modal -->
  <div id="confirmModal" class="modal-overlay" aria-hidden="true" style="display:none;">
    <div class="modal-content" role="dialog" aria-label="Confirmación">
      <div class="modal-header" style="justify-content:center;">
        <div class="modal-title" id="confirmTitle" style="text-align:center; width:100%; font-weight:700;"></div>
      </div>
      <div id="confirmBody" class="modal-body" style="text-align:center;"></div>
      <div class="modal-footer" style="display:flex; justify-content:flex-end; padding:8px; border-top:1px solid #2a2f57;">
        <button id="confirmCancel" class="close-btn" aria-label="Cancelar" style="margin-right:8px;">Cancelar</button>
        <button id="confirmOk" class="delete-btn" aria-label="Eliminar" style="background:#8b1a1a;">Eliminar</button>
      </div>
  </div>
  </div>
  <!-- Confirm Deletion Modal -->
  <div id="confirmModal" class="modal-overlay" aria-hidden="true" style="display:none;">
    <div class="modal-content" role="dialog" aria-label="Confirmación">
      <div class="modal-header" style="justify-content:center;">
        <div class="modal-title" id="confirmTitle" style="text-align:center; width:100%; font-weight:700;"></div>
      </div>
      <div id="confirmBody" class="modal-body" style="text-align:center;"></div>
      <div class="modal-footer" style="display:flex; justify-content:flex-end; padding:8px; border-top:1px solid #2a2f57;">
        <button id="confirmCancel" class="close-btn" aria-label="Cancelar" style="margin-right:8px;">Cancelar</button>
        <button id="confirmOk" class="delete-btn" aria-label="Eliminar" style="background:#8b1a1a;">Eliminar</button>
      </div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  </body>
  </html>
